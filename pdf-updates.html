<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a0a0f"><title>PDF Updates — Bhaai PDFs</title><link rel="icon" href="/logo.jpeg"><link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet"><style>
:root{color-scheme:dark;--bg:#0a0a0f;--panel:#17171f;--text:#f1eee9;--muted:#aaa5ad;--line:#ffffff18;--orange:#ff7949}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px 'Instrument Sans',sans-serif}header,main{width:min(1040px,calc(100% - 36px));margin:auto}header{height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}a{color:inherit;text-decoration:none}.brand{font:800 21px Syne}.brand img{width:32px;vertical-align:middle;margin-right:8px;border-radius:9px}.back{color:var(--muted)}main{padding:54px 0 90px}.eyebrow{color:var(--orange);font-size:11px;letter-spacing:2px;font-weight:700}h1{font:800 clamp(34px,6vw,56px) Syne;margin:8px 0} .intro{color:var(--muted);max-width:620px;line-height:1.7}.stats{display:flex;gap:12px;margin:28px 0}.stat{padding:16px 20px;border:1px solid var(--line);border-radius:16px;background:var(--panel);min-width:150px}.stat strong{display:block;font:800 27px Syne}.stat span{color:var(--muted);font-size:12px}.feed{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px;min-width:0}.tag{display:inline-block;border-radius:30px;padding:5px 10px;background:#ff79491c;color:#ff9b78;font-size:11px}.card h2{font:700 20px Syne;margin:14px 0 8px;overflow-wrap:anywhere}.desc{color:var(--muted);line-height:1.55}.meta{display:grid;gap:8px;color:var(--muted);font-size:13px;margin:18px 0}.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);padding-top:15px}.btn{border:1px solid var(--line);background:#ffffff08;color:var(--text);border-radius:11px;padding:10px 13px;cursor:pointer;font:600 13px inherit}.btn.primary{background:var(--orange);color:#1b100c;border-color:var(--orange)}.btn.liked{color:#ff8d83;border-color:#ff8d8366}.comments{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}.comments summary{cursor:pointer;color:var(--muted)}.comment-list{display:grid;gap:10px;margin:12px 0}.comment{padding:10px;background:#ffffff08;border-radius:10px}.comment b{font-size:12px}.comment p{margin:5px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}.comment-form{display:grid;gap:8px}.comment-form input,.comment-form textarea{width:100%;background:#0d0d13;border:1px solid var(--line);border-radius:9px;padding:10px;color:var(--text);font:inherit}.comment-form textarea{min-height:72px;resize:vertical}.empty{padding:30px;color:var(--muted);border:1px dashed var(--line);border-radius:18px;grid-column:1/-1}@media(max-width:680px){.feed{grid-template-columns:1fr}.stats{flex-wrap:wrap}.stat{flex:1;min-width:120px}main{padding-top:35px}}
</style></head><body><header><a class="brand" href="/"><img src="/logo.jpeg" alt="">BHAAI PDFs</a><a class="back" href="/">← Back to Library</a></header><main><p class="eyebrow">THE LATEST FROM THE STUDY SHELF</p><h1>PDF Updates</h1><p class="intro">Every new study material, clearly listed. Check its subject, section, upload time, downloads and what fellow students think.</p><div class="stats"><div class="stat"><strong id="total-updates">—</strong><span>Published updates</span></div><div class="stat"><strong id="total-downloads">—</strong><span>Downloads tracked</span></div></div><div id="pdf-updates" class="feed" aria-live="polite"><p class="empty">Loading latest uploads…</p></div></main><script type="module" src="/src/pdf-updates.js"></script></body></html>
