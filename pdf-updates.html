<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a0a0f"><title>PDF Updates — Bhaai PDFs</title><link rel="icon" href="/logo.jpeg"><link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet"><style>
:root{color-scheme:dark;--bg:#0a0a0f;--panel:#17171f;--text:#f1eee9;--muted:#aaa5ad;--line:#ffffff18;--orange:#ff7949}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px 'Instrument Sans',sans-serif}header,main{width:min(1040px,calc(100% - 36px));margin:auto}header{height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.header-actions{display:flex;align-items:center;gap:16px}.theme-toggle{position:relative;flex:0 0 88px;width:88px;height:32px;min-width:88px;min-height:32px;border:1px solid #ffffff35;border-radius:20px;padding:0;background:linear-gradient(100deg,#f5c76d,#9bc8e9 52%,#17294d);overflow:hidden;cursor:pointer;box-shadow:0 3px 12px #0003}.theme-track{position:absolute;inset:0;overflow:hidden;border-radius:inherit}.theme-sun{position:absolute;left:18%;top:50%;transform:translate(-50%,-50%);font-size:17px}.theme-moon{position:absolute;right:15%;top:50%;transform:translateY(-50%);font-size:16px;opacity:.9}.theme-cloud{position:absolute;left:34%;top:4px;font-size:17px;opacity:.9}.theme-knob{position:absolute;left:4px;top:4px;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 32% 30%,#fff,#f5f5f5);box-shadow:0 0 12px #fff9;transition:left .45s cubic-bezier(.65,-.1,.25,1.15)}.theme-toggle[aria-pressed=true] .theme-knob{left:60px}.theme-toggle:focus-visible{outline:3px solid #0a66c2;outline-offset:3px}a{color:inherit;text-decoration:none}.brand{font:800 21px Syne}.brand img{width:32px;vertical-align:middle;margin-right:8px;border-radius:9px}.back{color:var(--muted)}main{padding:54px 0 90px}.eyebrow{color:var(--orange);font-size:11px;letter-spacing:2px;font-weight:700}h1{font:800 clamp(34px,6vw,56px) Syne;margin:8px 0} .intro{color:var(--muted);max-width:620px;line-height:1.7}.stats{display:flex;gap:12px;margin:28px 0}.stat{padding:16px 20px;border:1px solid var(--line);border-radius:16px;background:var(--panel);min-width:150px}.stat strong{display:block;font:800 27px Syne}.stat span{color:var(--muted);font-size:12px}.feed{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px;min-width:0}.tag{display:inline-block;border-radius:30px;padding:5px 10px;background:#ff79491c;color:#ff9b78;font-size:11px}.card h2{font:700 20px Syne;margin:14px 0 8px;overflow-wrap:anywhere}.desc{color:var(--muted);line-height:1.55}.meta{display:grid;gap:8px;color:var(--muted);font-size:13px;margin:18px 0}.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);padding-top:15px}.btn{border:1px solid var(--line);background:#ffffff08;color:var(--text);border-radius:11px;padding:10px 13px;cursor:pointer;font:600 13px inherit}.btn.primary{background:var(--orange);color:#1b100c;border-color:var(--orange)}.btn.liked{color:#ff8d83;border-color:#ff8d8366}.comments{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}.comments summary{cursor:pointer;color:var(--muted)}.comment-list{display:grid;gap:10px;margin:12px 0}.comment{padding:10px;background:#ffffff08;border-radius:10px}.comment b{font-size:12px}.comment p{margin:5px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}.comment-form{display:grid;gap:8px}.comment-form input,.comment-form textarea{width:100%;background:#0d0d13;border:1px solid var(--line);border-radius:9px;padding:10px;color:var(--text);font:inherit}.comment-form textarea{min-height:72px;resize:vertical}.empty{padding:30px;color:var(--muted);border:1px dashed var(--line);border-radius:18px;grid-column:1/-1}@media(max-width:680px){.feed{grid-template-columns:1fr}.stats{flex-wrap:wrap}.stat{flex:1;min-width:120px}main{padding-top:35px}.header-actions{gap:10px}.back{font-size:13px}.theme-toggle{flex-basis:76px;width:76px;min-width:76px;height:30px;min-height:30px}.theme-toggle[aria-pressed=true] .theme-knob{left:51px}}

:root[data-theme=light]{color-scheme:light;--bg:#faf6f0;--panel:#fff;--text:#28211d;--muted:#756b65;--line:#33241c20;--orange:#b94e29}:root[data-theme=light] body{background:var(--bg);color:var(--text)}:root[data-theme=light] .stat,:root[data-theme=light] .card{box-shadow:0 8px 24px #5b32100b}:root[data-theme=light] .comment,:root[data-theme=light] .comment-form input,:root[data-theme=light] .comment-form textarea{background:#f5eee7;color:#30251f;border-color:#d9c9bd}:root[data-theme=light] .btn{color:#30251f;background:#fff;border-color:#dfd0c5}:root[data-theme=light] .btn.primary{background:#b94e29;color:#fff;border-color:#b94e29}:root[data-theme=light] .tag{background:#b94e2918;color:#9b3c1c}:root[data-theme=light] .theme-toggle{background:linear-gradient(100deg,#f5c76d,#b7d8ec 52%,#233c66)}

.filters{margin:26px 0 18px;padding:17px;border:1px solid var(--line);border-radius:18px;background:var(--panel);display:grid;gap:12px}.search-row,.filter-row{display:flex;gap:9px;flex-wrap:wrap}.search-row input{flex:1;min-width:190px}.filters input,.filters select{background:#0d0d13;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font:inherit;min-width:145px}.filter-row select{flex:1}.filter-clear{border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:#ffffff0a;color:var(--text);cursor:pointer}.filter-summary{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:12px}.featured-wrap{margin:22px 0}.featured-card{border:1px solid #ff794966;border-radius:19px;padding:20px;background:linear-gradient(120deg,#ff79491b,transparent 75%),var(--panel)}.featured-card h2{font:800 23px Syne;margin:12px 0 6px}.featured-label{font-size:10px;letter-spacing:1.5px;color:var(--orange);font-weight:800}.load-more-wrap{grid-column:1/-1;display:flex;justify-content:center;padding:12px}.load-more{background:var(--orange);color:#1b100c;border:0;border-radius:12px;padding:12px 24px;font-weight:800;cursor:pointer}.share-btn{color:var(--text)}[data-theme=light] .filters input,[data-theme=light] .filters select{background:#fff;color:#30251f;border-color:#dfd0c5}[data-theme=light] .filter-clear{background:#fff;color:#30251f}@media(max-width:680px){.filters{padding:13px}.filter-row select{min-width:calc(50% - 6px)}.filter-summary{flex-direction:column}}
</style></head><body><header><a class="brand" href="/"><img src="/logo.jpeg" alt="">BHAAI PDFs</a><div class="header-actions"><a class="back" href="/">← Back to Library</a><button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to day mode" aria-pressed="false" title="Switch theme"><span class="theme-track"><span class="theme-sun">☀️</span><span class="theme-cloud">☁️</span><span class="theme-moon">🌙</span></span><span class="theme-knob"></span></button></div></header><main><p class="eyebrow">THE LATEST FROM THE STUDY SHELF</p><h1>PDF Updates</h1><p class="intro">Every new study material, clearly listed. Check its subject, section, upload time, downloads and what fellow students think.</p><div class="stats"><div class="stat"><strong id="total-updates">—</strong><span>Published updates</span></div><div class="stat"><strong id="total-downloads">—</strong><span>Downloads tracked</span></div></div><section class="filters" aria-label="Filter PDF updates"><div class="search-row"><input id="updates-search" type="search" placeholder="Search PDFs, subjects or topics…" aria-label="Search updates"><button class="filter-clear" id="clear-filters" type="button">Clear filters</button></div><div class="filter-row"><select id="filter-section" aria-label="Filter by section"><option value="">All sections</option></select><select id="filter-subject" aria-label="Filter by subject"><option value="">All subjects</option></select><select id="filter-semester" aria-label="Filter by semester"><option value="">All semesters</option></select><select id="filter-type" aria-label="Filter by file type"><option value="">All file types</option></select><select id="sort-updates" aria-label="Sort updates"><option value="latest">Latest first</option><option value="oldest">Oldest first</option><option value="liked">Most liked</option><option value="downloaded">Most downloaded</option></select></div><div class="filter-summary"><span id="filter-count">Showing all updates</span><span id="filter-active"></span></div></section><section id="featured-update" class="featured-wrap" hidden></section><div id="pdf-updates" class="feed" aria-live="polite"><p class="empty">Loading latest uploads…</p></div></main><script>
(()=>{const root=document.documentElement,button=document.getElementById('theme-toggle');function apply(theme){root.dataset.theme=theme;root.style.colorScheme=theme;document.querySelector('meta[name="theme-color"]').content=theme==='light'?'#faf6f0':'#0a0a0f';button.setAttribute('aria-pressed',String(theme==='dark'));button.setAttribute('aria-label',theme==='dark'?'Switch to day mode':'Switch to night mode');button.title=theme==='dark'?'Switch to day mode':'Switch to night mode';try{localStorage.setItem('bhaai-theme',theme)}catch{}}let saved='dark';try{saved=localStorage.getItem('bhaai-theme')==='light'?'light':'dark'}catch{}apply(saved);button.addEventListener('click',()=>apply(root.dataset.theme==='light'?'dark':'light'));})();
</script><script type="module" src="/src/pdf-updates.js"></script></body></html>
