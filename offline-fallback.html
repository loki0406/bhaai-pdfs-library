<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a0a0f"><title>You're Offline — BHAAI PDFs</title><link rel="icon" href="/logo.jpeg"><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0%,#ff79491c,transparent 55%),#0a0a0f;color:#f3eee9;font:15px/1.6 Arial,sans-serif}.panel{width:min(100%,480px);text-align:center;padding:38px 28px;border:1px solid #ffffff18;border-radius:28px;background:#17161f;box-shadow:0 24px 90px #0008}.logo{width:64px;height:64px;border-radius:18px;object-fit:cover}.wifi{width:76px;height:76px;margin:24px auto 16px;display:grid;place-items:center;border-radius:24px;background:#ff79491c;color:#ff9a70;font-size:38px}.eyebrow{color:#ff9a70;font-size:11px;font-weight:700;letter-spacing:2px}h1{font-size:clamp(29px,7vw,40px);line-height:1.12;margin:8px 0 12px}p{color:#c5c0c8;margin:0 auto;max-width:360px}.steps{margin:24px 0;padding:16px;text-align:left;border-radius:15px;background:#ffffff08;color:#e9e3de;font-size:13px}.steps div+div{margin-top:9px}.steps span{color:#ff9a70;margin-right:9px}.retry{width:100%;padding:14px 18px;border:0;border-radius:13px;background:#ff7949;color:#21110c;font-weight:800;font-size:15px;cursor:pointer}.retry:disabled{opacity:.65;cursor:wait}.footer{margin-top:24px;color:#fff;font-weight:800;font-size:12px;letter-spacing:1px}.tagline{margin-top:5px;font-size:12px;color:#918b96}@media(prefers-reduced-motion:no-preference){.wifi{animation:pulse 2s ease-in-out infinite}@keyframes pulse{50%{box-shadow:0 0 0 10px #ff79490b}}}
</style></head><body><main class="panel"><img class="logo" src="/logo.jpeg" alt="BHAAI PDFs logo"><div class="wifi" aria-hidden="true">⌁</div><div class="eyebrow">BHAAI PDFS · CONNECTION STATUS</div><h1>Oops! You're Offline</h1><p>Please turn ON your Wi-Fi or mobile data to access the BHAAI PDFs website.</p><div class="steps"><div><span>●</span> Turn ON Wi-Fi or Mobile Data</div><div><span>●</span> Check your internet connection</div><div><span>●</span> Tap retry to reconnect</div></div><button class="retry" id="retry">Retry Connection ↻</button><div class="footer">— TEAM BHAAI PDFS</div><div class="tagline">✨ Keep Learning. Keep Growing!</div></main><script>
const button=document.getElementById('retry');async function retry(){button.disabled=true;button.textContent='Checking connection…';try{const response=await fetch(location.href,{method:'HEAD',cache:'no-store'});if(!response.ok)throw Error('offline');location.reload();}catch{button.disabled=false;button.textContent='Still offline — Try Again ↻';}}button.addEventListener('click',retry);window.addEventListener('online',retry);
</script></body></html>
